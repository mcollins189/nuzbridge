# Build the APK and attach it to a GitHub Release, so Obtainium can pull updates
# without anyone copying files off a PC.
#
# Triggered by pushing a tag like v0.60. Obtainium watches the releases feed,
# sees the .apk asset, and offers the update on the device.
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:          # lets a release be cut by hand from the Actions tab

permissions:
  contents: write             # required to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Debug build on purpose: it needs no signing key, and the app is a
      # personal tool rather than a Play Store listing. Swapping to a signed
      # release build later only means adding the keystore as a secret.
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Name the artifact after the tag
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/NuzBridge-${GITHUB_REF_NAME#v}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
